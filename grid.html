<!doctype html>
<html>
    <head><title> Grid practice</title></head>
    <body style="padding-bottom: 1000px;">
        <div style="
            display:grid;
            grid-template-columns:100px 100px">
            <div style="background-color:rgb(134, 134, 241)">div 1</div>
            <div style="background-color:rgb(255, 171, 185)">div 2<p>text</p></div>
        </div>

    <div style="
    margin-top:30px;
            display:grid;
            grid-template-columns:100px 100px 200px">
            <div style="background-color:rgb(134, 134, 241)">div 1</div>
            <div style="background-color:rgb(255, 171, 185)">div 2<p>text</p></div>
            <div style="background-color:rgb(134, 134, 241)">div 1</div>
             <div style="background-color:rgb(255, 171, 185)">div 2</div>
        </div>


        
    <div style="
    margin-top:30px;
            display:grid;
            grid-template-columns:100px 1fr">
            <div style="background-color:rgb(134, 134, 241)">div 1</div>
            <div style="background-color:rgb(255, 171, 185)">div 2</div>
            
        </div>
             
    <div style="
    margin-top:30px;
            display:grid;
            grid-template-columns:100px 1fr 2fr">
            <div style="background-color:rgb(134, 134, 241)">100px</div>
            <div style="background-color:rgb(255, 171, 185)">1fr</div>
            <div style="background-color:rgb(134, 134, 241)">1fr</div>
        </div>

        <div style="
            margin-top:30px;
            display:grid;
            grid-template-columns:1fr 1fr 1fr;
            column-gap:20px;
            row-gap:40px;">
            <div style="background-color:rgb(134, 134, 241); height:200px;">1fr</div>
            <div style="background-color:rgb(255, 171, 185);height:200px;">1fr</div>
            <div style="background-color:rgb(134, 134, 241); height:200px;">1fr</div>
            <div style="background-color:rgb(255, 171, 185); height:200px;">1fr</div>
            <div style="background-color:rgb(134, 134, 241);height:200px;">1fr</div>
            <div style="background-color:rgb(255, 171, 185);height:200px;">1fr</div>
        </div>

        </body>
</html>
